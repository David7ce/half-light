<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Game Itchio — Proyección astral</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23080a1c'/%3E%3Ccircle cx='16' cy='14' r='7' fill='none' stroke='%238fe6ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='14' r='3' fill='%238fe6ff'/%3E%3Cpath d='M9 27c3-4 11-4 14 0' fill='none' stroke='%23f2c46b' stroke-width='2'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Game Itchio: a pixel-art platformer about leaving your body. Slow time, walk through walls, climb the tower."
    />
  </head>
  <body>
    <div id="game"></div>

    <div class="touch" id="touch" hidden>
      <div class="touch__move">
        <button type="button" data-touch="left" aria-label="Izquierda">◀</button>
        <button type="button" data-touch="right" aria-label="Derecha">▶</button>
      </div>
      <div class="touch__act">
        <button type="button" data-touch="jump" aria-label="Saltar">SALTO</button>
        <button type="button" data-touch="astral" aria-label="Proyección astral">ASTRAL</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
